<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  #board{position:relative;width:1180px;height:640px;background:#ffffff;}
  .node{position:absolute;box-sizing:border-box;border:2px solid #333333;background:#ffffff;
        display:flex;align-items:center;justify-content:center;
        font-family:Arial,Helvetica,sans-serif;font-size:18px;color:#111111;text-align:center;}
  #browser{left:60px;top:270px;width:180px;height:80px;}
  #gateway{left:340px;top:270px;width:180px;height:80px;}
  #ticketapi{left:620px;top:270px;width:180px;height:80px;}
  #seatstore{left:900px;top:270px;width:180px;height:80px;}
  #overlay{position:absolute;left:0;top:0;width:1180px;height:640px;}
  .lbl{font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#111111;}
</style>
</head>
<body>
<div id="board">
  <div class="node" id="browser">Browser</div>
  <div class="node" id="gateway">Gateway</div>
  <div class="node" id="ticketapi">Ticket API</div>
  <div class="node" id="seatstore">Seat Store</div>

  <svg id="overlay" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
              markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#333333"/>
      </marker>
    </defs>

    <!-- Browser -> Gateway (HTTPS) -->
    <line x1="240" y1="310" x2="340" y2="310" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="290" y="298" text-anchor="middle">HTTPS</text>

    <!-- Gateway -> Ticket API (reserve) -->
    <line x1="520" y1="310" x2="620" y2="310" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="570" y="298" text-anchor="middle">reserve</text>

    <!-- Ticket API -> Seat Store (hold seat) -->
    <line x1="800" y1="310" x2="900" y2="310" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="850" y="298" text-anchor="middle">hold seat</text>

    <!-- Seat Store -> Ticket API (availability) -->
    <line x1="900" y1="340" x2="800" y2="340" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="850" y="368" text-anchor="middle">availability</text>
  </svg>
</div>
</body>
</html>
