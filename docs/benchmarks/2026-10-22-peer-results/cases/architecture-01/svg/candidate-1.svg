<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Browser -->
  <g>
    <rect x="80" y="300" width="180" height="70" rx="4" ry="4" fill="#E8F0FE" stroke="#333333" stroke-width="2"/>
    <text x="170" y="340" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#111111">Browser</text>
  </g>

  <!-- Gateway -->
  <g>
    <rect x="400" y="300" width="180" height="70" rx="4" ry="4" fill="#E8F0FE" stroke="#333333" stroke-width="2"/>
    <text x="490" y="340" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#111111">Gateway</text>
  </g>

  <!-- Ticket API -->
  <g>
    <rect x="720" y="300" width="180" height="70" rx="4" ry="4" fill="#E8F0FE" stroke="#333333" stroke-width="2"/>
    <text x="810" y="340" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#111111">Ticket API</text>
  </g>

  <!-- Seat Store -->
  <g>
    <rect x="720" y="520" width="180" height="70" rx="4" ry="4" fill="#E8F0FE" stroke="#333333" stroke-width="2"/>
    <text x="810" y="560" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#111111">Seat Store</text>
  </g>

  <!-- Browser -> Gateway (HTTPS) -->
  <path d="M 260 335 L 400 335" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="325" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333333">HTTPS</text>

  <!-- Gateway -> Ticket API (reserve) -->
  <path d="M 580 335 L 720 335" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="325" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#333333">reserve</text>

  <!-- Ticket API -> Seat Store (hold seat) -->
  <path d="M 810 370 L 810 520" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="820" y="450" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333333">hold seat</text>

  <!-- Seat Store -> Ticket API (availability) -->
  <path d="M 900 520 L 900 370" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="910" y="450" font-family="Arial, sans-serif" font-size="13" text-anchor="start" fill="#333333">availability</text>
</svg>