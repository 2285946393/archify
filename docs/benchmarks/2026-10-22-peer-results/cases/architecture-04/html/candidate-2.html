<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#ffffff;}
  #board{position:relative;width:1180px;height:660px;background:#ffffff;font-family:Arial,Helvetica,sans-serif;}
  .node{position:absolute;box-sizing:border-box;border:2px solid #333333;background:#ffffff;color:#111111;
        display:flex;align-items:center;justify-content:center;text-align:center;
        font-size:16px;padding:4px;line-height:1.2;}
  #n-shop{left:40px;top:290px;width:170px;height:64px;}
  #n-order{left:300px;top:290px;width:170px;height:64px;}
  #n-inv{left:600px;top:120px;width:190px;height:64px;}
  #n-invdb{left:920px;top:120px;width:190px;height:64px;}
  #n-pay{left:600px;top:460px;width:190px;height:64px;}
  #n-audit{left:600px;top:290px;width:190px;height:64px;}
  #overlay{position:absolute;left:0;top:0;width:1180px;height:660px;pointer-events:none;}
  .lbl{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#111111;}
</style>
</head>
<body>
<div id="board">
  <div class="node" id="n-shop">Shop UI</div>
  <div class="node" id="n-order">Order API</div>
  <div class="node" id="n-inv">Inventory Service</div>
  <div class="node" id="n-invdb">Inventory DB</div>
  <div class="node" id="n-pay">Payment Service</div>
  <div class="node" id="n-audit">Audit Log</div>

  <svg id="overlay" viewBox="0 0 1180 660" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8"
              orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L10,5 L0,10 Z" fill="#333333"/>
      </marker>
    </defs>

    <!-- Shop UI -> Order API (checkout) -->
    <line x1="210" y1="322" x2="300" y2="322" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="255" y="312" text-anchor="middle">checkout</text>

    <!-- Order API -> Inventory Service (reserve) -->
    <line x1="385" y1="290" x2="640" y2="184" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="500" y="228" text-anchor="middle">reserve</text>

    <!-- Inventory Service -> Inventory DB (update) -->
    <line x1="790" y1="152" x2="920" y2="152" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="855" y="142" text-anchor="middle">update</text>

    <!-- Order API -> Payment Service (charge) -->
    <line x1="385" y1="354" x2="695" y2="460" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="530" y="418" text-anchor="middle">charge</text>

    <!-- Payment Service -> Order API (payment result) -->
    <line x1="695" y1="492" x2="385" y2="386" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="530" y="452" text-anchor="middle">payment result</text>

    <!-- Order API -> Audit Log (record) -->
    <line x1="470" y1="322" x2="600" y2="322" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text class="lbl" x="535" y="312" text-anchor="middle">record</text>
  </svg>
</div>
</body>
</html>
