<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>权限申请流程</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  #board {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #ffffff;
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .node {
    position: absolute;
    box-sizing: border-box;
    border: 2px solid #2f4f6f;
    background: #eef3f8;
    color: #1c2b3a;
    font-size: 20px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }
  #Request { left: 80px;  top: 300px; width: 180px; height: 80px; }
  #Review  { left: 420px; top: 300px; width: 180px; height: 80px; }
  #Grant   { left: 800px; top: 160px; width: 180px; height: 80px; }
  #Reject  { left: 800px; top: 440px; width: 180px; height: 80px; }
  #connectors { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  .edge-label {
    font-size: 16px;
    fill: #1c2b3a;
    font-family: "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
</style>
</head>
<body>
<div id="board">
  <div class="node" id="Request">Request</div>
  <div class="node" id="Review">Review</div>
  <div class="node" id="Grant">Grant</div>
  <div class="node" id="Reject">Reject</div>

  <svg id="connectors" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5"
              markerWidth="10" markerHeight="10" orient="auto"
              markerUnits="userSpaceOnUse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f4f6f" stroke="none"></path>
      </marker>
    </defs>

    <!-- Request -> Review (submit) -->
    <line x1="260" y1="340" x2="420" y2="340"
          fill="none" stroke="#2f4f6f" stroke-width="2"
          marker-end="url(#arrow)"></line>
    <text class="edge-label" x="340" y="328" text-anchor="middle">submit</text>

    <!-- Review -> Grant (approved) -->
    <line x1="600" y1="340" x2="800" y2="200"
          fill="none" stroke="#2f4f6f" stroke-width="2"
          marker-end="url(#arrow)"></line>
    <text class="edge-label" x="700" y="252" text-anchor="middle">approved</text>

    <!-- Review -> Reject (denied) -->
    <line x1="600" y1="340" x2="800" y2="480"
          fill="none" stroke="#2f4f6f" stroke-width="2"
          marker-end="url(#arrow)"></line>
    <text class="edge-label" x="700" y="428" text-anchor="middle">denied</text>
  </svg>
</div>
</body>
</html>
