<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333333"/>
    </marker>
  </defs>

  <!-- Request -->
  <g>
    <rect x="120" y="300" width="160" height="70" rx="4" ry="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="200" y="342" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222" text-anchor="middle">Request</text>
  </g>

  <!-- Review -->
  <g>
    <rect x="420" y="300" width="160" height="70" rx="4" ry="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="500" y="342" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222" text-anchor="middle">Review</text>
  </g>

  <!-- Grant -->
  <g>
    <rect x="760" y="180" width="160" height="70" rx="4" ry="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="840" y="222" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222" text-anchor="middle">Grant</text>
  </g>

  <!-- Reject -->
  <g>
    <rect x="760" y="420" width="160" height="70" rx="4" ry="4" fill="#ffffff" stroke="#333333" stroke-width="2"/>
    <text x="840" y="462" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#222222" text-anchor="middle">Reject</text>
  </g>

  <!-- Request -> Review (submit) -->
  <path d="M280,335 L420,335" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="350" y="322" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333" text-anchor="middle">submit</text>

  <!-- Review -> Grant (approved) -->
  <path d="M580,335 L640,335 L640,215 L760,215" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333" text-anchor="start">approved</text>

  <!-- Review -> Reject (denied) -->
  <path d="M580,335 L640,335 L640,455 L760,455" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="405" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333333" text-anchor="start">denied</text>
</svg>