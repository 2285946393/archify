<!doctype html>
<html>
<head>
<style>
  html,body{margin:0;padding:0;background:#fff;}
  #board{position:relative;width:1200px;height:640px;background:#fff;}
  .node{position:absolute;box-sizing:border-box;border:2px solid #333;background:#fff;
        display:flex;align-items:center;justify-content:center;text-align:center;
        font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#111;padding:4px;}
  svg{position:absolute;left:0;top:0;width:1200px;height:640px;}
  .lbl{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#111;}
</style>
</head>
<body>
<div id="board">
  <svg>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
        <path d="M0,0 L10,5 L0,10 Z" fill="#333"/>
      </marker>
    </defs>

    <!-- Return Request -> Eligibility Check -->
    <line x1="250" y1="120" x2="250" y2="200" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text class="lbl" x="258" y="165">submit</text>

    <!-- Eligibility Check -> Reject -->
    <line x1="330" y1="240" x2="560" y2="240" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text class="lbl" x="430" y="232">ineligible</text>

    <!-- Eligibility Check -> Receive Parcel -->
    <line x1="250" y1="280" x2="250" y2="360" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text class="lbl" x="258" y="325">eligible</text>

    <!-- Receive Parcel -> Inspect -->
    <line x1="250" y1="440" x2="250" y2="520" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text class="lbl" x="258" y="485">arrived</text>

    <!-- Inspect -> Refund -->
    <line x1="330" y1="560" x2="560" y2="560" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text class="lbl" x="430" y="552">accepted</text>

    <!-- Inspect -> Reject -->
    <line x1="250" y1="520" x2="250" y2="280" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <text class="lbl" x="258" y="400">damaged</text>
  </svg>

  <div class="node" style="left:150px;top:60px;width:200px;height:60px;">Return Request</div>
  <div class="node" style="left:150px;top:200px;width:200px;height:80px;">Eligibility Check</div>
  <div class="node" style="left:560px;top:200px;width:160px;height:80px;">Reject</div>
  <div class="node" style="left:150px;top:360px;width:200px;height:80px;">Receive Parcel</div>
  <div class="node" style="left:150px;top:520px;width:200px;height:80px;">Inspect</div>
  <div class="node" style="left:560px;top:520px;width:160px;height:80px;">Refund</div>
</div>
</body>
</html>
